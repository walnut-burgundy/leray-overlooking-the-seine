name: Leray exact-flow independent acceptance

on:
  pull_request:
  push:
    branches: [main, work/leray-exact-01]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: leray-exact-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact producer head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out registered FP source and operation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/flexible-pipes
          ref: e5ee7c8b6c1821d5230d772a9e225a139aa14658
          path: .leray-inputs/fp
          persist-credentials: false
      - name: Check out pinned Kitchen recipe
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/kitchen
          ref: d75ad256a32b9594530128772db1387af0487f21
          path: .leray-inputs/kitchen
          persist-credentials: false
      - name: Check out independent MOON and AI-CI source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/ai-ci
          ref: 398c260db362e235a9ebaa3f2a00e8a3cd1198e5
          path: .leray-inputs/aici
          persist-credentials: false
      - name: Check out pinned Ike
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: dilapidated-shed/ike
          ref: 93f9eb0aee9094757414df8a7929c89b6a294b0c
          path: .leray-inputs/ike
          persist-credentials: false
      - name: Acquire and qualify native ICK C11 toolchain
        id: ick
        uses: ./.leray-inputs/aici/ick-host
      - name: Acquire the pinned compiled Grease runtime
        env:
          GH_TOKEN: ${{ github.token }}
          ICK: ${{ steps.ick.outputs.compiler }}
        shell: bash
        run: |
          gh api repos/dilapidated-shed/grease/actions/artifacts/12192502970/zip > "$RUNNER_TEMP/grease.zip"
          printf '%s  %s\n' 295329ec3bb419d90364fcb5937eafe4306b03f68b7aaa63089dadde8082ffb5 "$RUNNER_TEMP/grease.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/grease.zip" '_bin/cxx-asan/ysh' -d "$RUNNER_TEMP/grease-runtime"
          chmod 755 "$RUNNER_TEMP/grease-runtime/_bin/cxx-asan/ysh"
          printf '%s  %s\n' 7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c "$RUNNER_TEMP/grease-runtime/_bin/cxx-asan/ysh" | sha256sum -c -
          "$ICK" -fno-link-libatomic -O2 -std=c11 -Wall -Wextra -Werror -pedantic .leray-inputs/kitchen/tasks/leray-exact-01/grease-applet.c -o "$RUNNER_TEMP/grease"
      - name: Replay FP-recorded source import
        working-directory: .leray-inputs/fp
        run: python3 scripts/run-pipeline leray-exact-01-import
      - name: Execute FP to Kitchen and Ike to independent AI-CI
        working-directory: .leray-inputs/fp
        env:
          ICK: ${{ steps.ick.outputs.compiler }}
          GREASE_IMPLEMENTATION: ${{ runner.temp }}/grease-runtime/_bin/cxx-asan/ysh
          ASAN_OPTIONS: detect_leaks=0
        shell: bash
        run: >-
          python3 scripts/run-pipeline leray-exact-01
          --param fp="$GITHUB_WORKSPACE/.leray-inputs/fp"
          --param compiler="$ICK"
          --param grease="$RUNNER_TEMP/grease"
          --param evidence="$RUNNER_TEMP/leray-evidence"
      - name: Retain exact-source FP, Ike and independent receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leray-exact-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .leray-inputs/fp/.flexible-pipes/runs
            ${{ runner.temp }}/leray-evidence
            ${{ runner.temp }}/ick-host-stage/host-runtime-packages.tsv
            ${{ runner.temp }}/ick-host-stage/host-runtime.sha256
          if-no-files-found: warn
